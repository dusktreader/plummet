[project]
name = "plummet"
version = "2.0.0"
description = "Utilities for testing with pendulum timestamps"
authors = [
    {name = "Tucker Beck", email ="tucker.beck@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE.md"]

requires-python = ">=3.11"

dependencies = [
    "pendulum>=3.3",
    "py-buzz>=9.0",
]

[project.urls]
homepage = "https://github.com/dusktreader/plummet"
source = "https://github.com/dusktreader/plummet"
changelog = "https://github.com/dusktreader/plummet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
time-machine = [
    "time-machine>=2"
]

[dependency-groups]
dev = [
    "pendulum[test]>=3.3",
    "pyclean>=3.7",
    "pytest>=9.2",
    "pytest-bdd>=9.0",
    "pytest-cov>=7.1",
    "pytest-mock>=3.17",
    "pytest-pretty>=1.3",
    "pytest-random-order>=1.2",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "typos>=1.52",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = [
    "--random-order",
    "--cov=src/plummet",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "--cov-report=xml:.coverage.xml",
    "--junitxml=.junit.xml",
    "--override-ini=junit_family=legacy",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src/plummet", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.typos.default]
extend-ignore-identifiers-re = []

[build-system]
requires = ["uv-build>=0.13.7,<0.14"]
build-backend = "uv_build"
